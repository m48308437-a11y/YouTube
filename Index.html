<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Downloader Pro</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            color: white;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #3b176b 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    #123c72 0%,
                    transparent 35%
                ),
                #070914;
        }

        .container {
            width: min(900px, 92%);
            margin: auto;
            padding: 35px 0;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            width: 80px;
            height: 80px;

            margin: auto;

            border-radius: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            box-shadow:
                0 0 30px #6d28d9;
        }

        h1 {
            margin-top: 20px;
            font-size: 34px;
        }

        .subtitle {
            color: #9ca3af;
            margin-top: 10px;
        }

        .card {
            padding: 30px;

            border-radius: 25px;

            background:
                rgba(20, 24, 40, .85);

            border:
                1px solid rgba(255,255,255,.08);

            box-shadow:
                0 20px 60px rgba(0,0,0,.35);
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .input-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;

            height: 55px;

            border: none;
            outline: none;

            border-radius: 15px;

            padding: 0 18px;

            color: white;

            background: #0d1222;

            font-size: 15px;
        }

        input:focus {
            box-shadow:
                0 0 0 2px #7c3aed;
        }

        .paste {
            width: 90px;

            border: none;

            border-radius: 15px;

            background: #272d42;

            color: white;

            cursor: pointer;
        }

        .settings {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;

            margin-top: 25px;
        }

        select {
            width: 100%;
            height: 50px;

            border: none;
            outline: none;

            border-radius: 14px;

            padding: 0 15px;

            color: white;

            background: #0d1222;
        }

        .download {
            width: 100%;
            height: 58px;

            margin-top: 25px;

            border: none;

            border-radius: 17px;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            box-shadow:
                0 10px 30px
                rgba(99,102,241,.3);
        }

        .download:hover {
            transform: translateY(-2px);
        }

        .progress-area {
            display: none;
            margin-top: 25px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;

            margin-bottom: 10px;

            color: #cbd5e1;
        }

        .progress {
            height: 10px;

            border-radius: 20px;

            overflow: hidden;

            background: #0d1222;
        }

        .progress-bar {
            width: 0%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #7c3aed,
                    #2563eb
                );

            transition: width .3s;
        }

        .history {
            margin-top: 30px;
        }

        .history h2 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .download-item {
            display: flex;
            align-items: center;

            gap: 15px;

            padding: 15px;

            margin-bottom: 10px;

            border-radius: 15px;

            background: #0d1222;
        }

        .icon {
            width: 45px;
            height: 45px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: #202640;

            font-size: 22px;
        }

        .info {
            flex: 1;
        }

        .info strong {
            display: block;
            margin-bottom: 5px;
        }

        .info span {
            color: #8b93a7;
            font-size: 13px;
        }

        footer {
            text-align: center;

            margin-top: 25px;

            color: #697386;

            font-size: 13px;
        }

        @media(max-width: 600px) {

            .container {
                padding-top: 20px;
            }

            h1 {
                font-size: 27px;
            }

            .card {
                padding: 20px;
            }

            .input-box {
                flex-direction: column;
            }

            .paste {
                width: 100%;
                height: 45px;
            }

            .settings {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <header>

        <div class="logo">
            ⬇️
        </div>

        <h1>
            Downloader Pro
        </h1>

        <p class="subtitle">
            دانلودر مدرن و سریع
        </p>

    </header>


    <main class="card">

        <label>
            🔗 لینک ویدئو
        </label>

        <div class="input-box">

            <input
                id="url"
                type="text"
                placeholder="لینک ویدئو را وارد کنید..."
            >

            <button
                class="paste"
                onclick="pasteURL()"
            >
                چسباندن
            </button>

        </div>


        <div class="settings">

            <div>

                <label>
                    کیفیت
                </label>

                <select id="quality">

                    <option value="1080">
                        🎥 1080p
                    </option>

                    <option value="720">
                        🎥 720p
                    </option>

                    <option value="480">
                        🎥 480p
                    </option>

                    <option value="360">
                        🎥 360p
                    </option>

                </select>

            </div>


            <div>

                <label>
                    فرمت
                </label>

                <select id="format">

                    <option value="mp4">
                        🎬 MP4
                    </option>

                    <option value="mp3">
                        🎵 MP3
                    </option>

                </select>

            </div>

        </div>


        <button
            class="download"
            onclick="startDownload()"
        >
            ⬇️ شروع دانلود
        </button>


        <div
            class="progress-area"
            id="progressArea"
        >

            <div class="progress-text">

                <span>
                    در حال آماده‌سازی...
                </span>

                <span id="percent">
                    0%
                </span>

            </div>

            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>

        </div>


        <section class="history">

            <h2>
                📋 دانلودهای اخیر
            </h2>

            <div id="historyList">

                <div class="download-item">

                    <div class="icon">
                        📥
                    </div>

                    <div class="info">

                        <strong>
                            هنوز دانلودی انجام نشده
                        </strong>

                        <span>
                            دانلودهای شما اینجا نمایش داده می‌شوند
                        </span>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer>
        Downloader Pro © 2026
    </footer>

</div>


<script>

async function pasteURL() {

    try {

        const text =
            await navigator.clipboard.readText();

        document.getElementById("url").value =
            text;

    } catch {

        alert(
            "دسترسی به کلیپ‌بورد ممکن نیست."
        );

    }

}


async function startDownload() {

    const url =
        document.getElementById("url")
        .value
        .trim();

    const quality =
        document.getElementById("quality")
        .value;

    const format =
        document.getElementById("format")
        .value;


    if (!url) {

        alert(
            "لطفاً لینک را وارد کن!"
        );

        return;
    }


    const progressArea =
        document.getElementById(
            "progressArea"
        );

    const progressBar =
        document.getElementById(
            "progressBar"
        );

    const percent =
        document.getElementById(
            "percent"
        );


    progressArea.style.display =
        "block";


    progressBar.style.width =
        "20%";

    percent.innerText =
        "در حال اتصال...";


    try {

        const response =
            await fetch(
                "/download",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        url: url,

                        quality: quality

                    })

                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error
            );

        }


        progressBar.style.width =
            "100%";

        percent.innerText =
            "100%";


        const link =
            document.createElement("a");

        link.href =
            data.file;

        link.download =
            "";

        document.body.appendChild(link);

        link.click();

        link.remove();


        addHistory(
            url,
            quality,
            format
        );


    } catch (error) {

        alert(
            "خطا:\n" +
            error.message
        );

        progressBar.style.width =
            "0%";

        percent.innerText =
            "خطا";

    }

}


function addHistory(
    url,
    quality,
    format
) {

    const history =
        document.getElementById(
            "historyList"
        );


    history.innerHTML = `

        <div class="download-item">

            <div class="icon">
                ${format === "mp3"
                    ? "🎵"
                    : "🎬"}
            </div>

            <div class="info">

                <strong>
                    دانلود انجام شد
                </strong>

                <span>
                    کیفیت: ${quality}p
                    • فرمت: ${format}
                </span>

            </div>

        </div>

    ` + history.innerHTML;

}

</script>

</body>

</html>

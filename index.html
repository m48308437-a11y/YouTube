<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Downloader Pro</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    min-height: 100vh;

    color: white;

    background:
        radial-gradient(
            circle at top left,
            #4c1d95,
            transparent 35%
        ),

        radial-gradient(
            circle at bottom right,
            #1d4ed8,
            transparent 35%
        ),

        #070b16;

}


.container {

    width: 92%;

    max-width: 850px;

    margin: auto;

    padding: 40px 0;

}


header {

    text-align: center;

    margin-bottom: 30px;

}


.logo {

    width: 80px;

    height: 80px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 24px;

    font-size: 38px;

    background:

        linear-gradient(
            135deg,
            #8b5cf6,
            #2563eb
        );

}


h1 {

    margin-top: 18px;

    font-size: 32px;

}


.subtitle {

    color: #a5aec1;

    margin-top: 8px;

}


.card {

    background:

        rgba(
            17,
            24,
            39,
            .92
        );

    border:

        1px solid
        rgba(
            255,
            255,
            255,
            .08
        );

    border-radius: 24px;

    padding: 28px;

}


.label {

    display: block;

    margin-bottom: 9px;

    font-weight: bold;

}


.url-box {

    display: flex;

    gap: 10px;

}


input,
select {

    border:

        1px solid
        #27324a;

    outline: none;

    background: #0b1220;

    color: white;

    border-radius: 14px;

}


input {

    flex: 1;

    height: 52px;

    padding: 0 16px;

}


.paste {

    width: 90px;

    border: none;

    border-radius: 14px;

    background: #252f45;

    color: white;

}


.settings {

    display: grid;

    grid-template-columns:

        1fr
        1fr;

    gap: 15px;

    margin-top: 22px;

}


select {

    width: 100%;

    height: 50px;

    padding: 0 12px;

}


.download-btn {

    width: 100%;

    height: 56px;

    margin-top: 24px;

    border: none;

    border-radius: 15px;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    background:

        linear-gradient(
            135deg,
            #7c3aed,
            #2563eb
        );

}


.download-btn:disabled {

    opacity: .6;

}


.status {

    margin-top: 20px;

    padding: 15px;

    border-radius: 14px;

    background: #0b1220;

    color: #cbd5e1;

}


.video-info {

    display: none;

    margin-top: 25px;

    padding: 15px;

    border-radius: 18px;

    background: #0b1220;

    gap: 15px;

}


.thumbnail {

    width: 150px;

    border-radius: 12px;

}


.video-text {

    flex: 1;

}


.video-text h3 {

    margin-bottom: 10px;

}


.history {

    margin-top: 30px;

}


.history-item {

    padding: 15px;

    margin-top: 10px;

    border-radius: 15px;

    background: #0b1220;

}


footer {

    text-align: center;

    margin-top: 25px;

    color: #68738a;

}


@media
(max-width: 600px) {

    .url-box {

        flex-direction: column;

    }


    .paste {

        width: 100%;

        height: 45px;

    }


    .settings {

        grid-template-columns:

            1fr;

    }


    .video-info {

        flex-direction: column;

    }


    .thumbnail {

        width: 100%;

    }

}

</style>

</head>


<body>


<div class="container">


<header>

<div class="logo">
⬇
</div>


<h1>
Downloader Pro
</h1>


<p class="subtitle">
دانلودر مدرن و سریع
</p>


</header>



<div class="card">


<label class="label">
لینک ویدئو
</label>


<div class="url-box">


<input

id="url"

type="text"

placeholder="لینک ویدئو را وارد کنید..."

>


<button

class="paste"

id="pasteBtn"

>

چسباندن

</button>


</div>



<div class="settings">


<div>


<label class="label">

کیفیت

</label>


<select id="quality">


<option value="1080">

1080p

</option>


<option value="720">

720p

</option>


<option value="480">

480p

</option>


<option value="360">

360p

</option>


</select>


</div>



<div>


<label class="label">

فرمت

</label>


<select id="format">


<option value="mp4">

MP4

</option>


<option value="mp3">

MP3

</option>


</select>


</div>


</div>



<button

class="download-btn"

id="infoBtn"

>

🔍 دریافت اطلاعات ویدئو

</button>



<button

class="download-btn"

id="downloadBtn"

>

⬇️ دانلود

</button>



<div

class="video-info"

id="videoInfo"

>


<img

id="thumbnail"

class="thumbnail"

>


<div

class="video-text"

>


<h3 id="videoTitle">

</h3>


<p id="videoChannel">

</p>


<p id="videoDuration">

</p>


</div>


</div>



<div

class="status"

id="status"

>

آماده

</div>



<div class="history">


<h2>

📋 دانلودهای اخیر

</h2>


<div id="historyList">


<div class="history-item">

هنوز دانلودی انجام نشده

</div>


</div>


</div>


</div>



<footer>

Downloader Pro © 2026

</footer>


</div>



<script>


const API_URL =

"https://youtube-y4x9.onrender.com";


const urlInput =

document.getElementById("url");


const quality =

document.getElementById("quality");


const format =

document.getElementById("format");


const status =

document.getElementById("status");


const infoBtn =

document.getElementById("infoBtn");


const downloadBtn =

document.getElementById("downloadBtn");


const videoInfo =

document.getElementById("videoInfo");


const thumbnail =

document.getElementById("thumbnail");


const videoTitle =

document.getElementById("videoTitle");


const videoChannel =

document.getElementById("videoChannel");


const videoDuration =

document.getElementById("videoDuration");


const historyList =

document.getElementById("historyList");


document

.getElementById("pasteBtn")

.addEventListener(

"click",

async () => {


try {


const text =

await

navigator.clipboard.readText();


urlInput.value =

text;


}

catch {


alert(

"دسترسی به کلیپ‌بورد ممکن نیست."

);


}


}

);



infoBtn.addEventListener(

"click",

async () => {


const url =

urlInput.value.trim();


if (!url) {


alert(

"اول لینک ویدئو را وارد کن!"

);


return;


}


status.textContent =

"در حال دریافت اطلاعات...";


try {


const response =

await fetch(

API_URL +

"/info?url=" +

encodeURIComponent(url)

);


const data =

await response.json();


if (!data.success) {


throw new Error(

data.error

);


}


thumbnail.src =

data.thumbnail;


videoTitle.textContent =

data.title;


videoChannel.textContent =

"کانال: " +

data.channel;


const minutes =

Math.floor(

data.duration / 60

);


const seconds =

data.duration % 60;


videoDuration.textContent =

"مدت: " +

minutes +

":" +

String(seconds)

.padStart(

2,

"0"

);


videoInfo.style.display =

"flex";


status.textContent =

"اطلاعات ویدئو آماده است ✅";


}

catch (error) {


status.textContent =

"خطا: " +

error.message;


}


}

);



downloadBtn.addEventListener(

"click",

async () => {


const url =

urlInput.value.trim();


if (!url) {


alert(

"لینک ویدئو را وارد کن!"

);


return;


}


status.textContent =

"در حال دانلود و آماده‌سازی فایل...";


downloadBtn.disabled =

true;


try {


const response =

await fetch(

API_URL +

"/download",

{

method:

"POST",

headers: {

"Content-Type":

"application/json"

},

body:

JSON.stringify({

url:

url,

quality:

quality.value,

format:

format.value

})

}

);


if (!response.ok) {


const error =

await response.text();


throw new Error(

error

);


}


const blob =

await response.blob();


const fileURL =

URL.createObjectURL(

blob

);


const link =

document.createElement(

"a"

);


link.href =

fileURL;


link.download =

"video." +

format.value;


document.body.appendChild(

link

);


link.click();


link.remove();


URL.revokeObjectURL(

fileURL

);


status.textContent =

"دانلود شروع شد ✅";


const item =

document.createElement(

"div"

);


item.className =

"history-item";


item.textContent =

"دانلود انجام شد - " +

format.value.toUpperCase() +

" - " +

quality.value +

"p";


historyList.prepend(

item

);


}

catch (error) {


status.textContent =

"خطا: " +

error.message;


}

finally {


downloadBtn.disabled =

false;


}


}

);


</script>


</body>

</html>

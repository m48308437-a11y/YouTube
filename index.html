<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Downloader Pro</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            min-height: 100vh;
            color: white;

            background:
                radial-gradient(circle at top left, #4c1d95, transparent 35%),
                radial-gradient(circle at bottom right, #1d4ed8, transparent 35%),
                #070b16;
        }

        .container {
            width: 92%;
            max-width: 850px;
            margin: auto;
            padding: 40px 0;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 24px;

            font-size: 38px;

            background: linear-gradient(
                135deg,
                #8b5cf6,
                #2563eb
            );

            box-shadow:
                0 0 35px rgba(124,58,237,.5);
        }

        h1 {
            margin-top: 18px;
            font-size: 32px;
        }

        .subtitle {
            color: #a5aec1;
            margin-top: 8px;
        }

        .card {
            background: rgba(17, 24, 39, .92);

            border: 1px solid rgba(255,255,255,.08);

            border-radius: 24px;

            padding: 28px;

            box-shadow:
                0 20px 60px rgba(0,0,0,.4);
        }

        .label {
            display: block;
            margin-bottom: 9px;

            color: #e5e7eb;

            font-weight: bold;
        }

        .url-box {
            display: flex;
            gap: 10px;
        }

        input,
        select {
            border: 1px solid #27324a;
            outline: none;

            background: #0b1220;
            color: white;

            border-radius: 14px;
        }

        input {
            flex: 1;

            height: 52px;

            padding: 0 16px;

            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #8b5cf6;
        }

        .paste {
            width: 90px;

            border: none;
            border-radius: 14px;

            background: #252f45;
            color: white;

            cursor: pointer;
        }

        .paste:hover {
            background: #34415c;
        }

        .settings {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

            margin-top: 22px;
        }

        select {
            width: 100%;
            height: 50px;

            padding: 0 12px;
        }

        .download-btn {
            width: 100%;
            height: 56px;

            margin-top: 24px;

            border: none;
            border-radius: 15px;

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #2563eb
            );

            transition: .2s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
        }

        .download-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .status-box {
            display: none;

            margin-top: 20px;

            padding: 15px;

            border-radius: 14px;

            background: #0b1220;

            color: #cbd5e1;
        }

        .progress-box {
            display: none;

            margin-top: 20px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;

            margin-bottom: 8px;

            color: #cbd5e1;
        }

        .progress {
            width: 100%;
            height: 9px;

            background: #0b1220;

            border-radius: 20px;

            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;

            background: linear-gradient(
                90deg,
                #8b5cf6,
                #2563eb
            );

            transition: width .2s;
        }

        .history {
            margin-top: 30px;
        }

        .history-title {
            font-size: 20px;
            margin-bottom: 14px;
        }

        .history-item {
            display: flex;
            align-items: center;

            gap: 14px;

            padding: 14px;

            margin-top: 10px;

            border-radius: 15px;

            background: #0b1220;

            border: 1px solid #172036;
        }

        .history-icon {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: #202b45;

            font-size: 22px;
        }

        .history-text {
            overflow: hidden;
        }

        .history-text strong {
            display: block;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-text small {
            display: block;

            margin-top: 5px;

            color: #8993a7;
        }

        footer {
            text-align: center;

            margin-top: 25px;

            color: #68738a;

            font-size: 13px;
        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
                padding: 25px 0;
            }

            .card {
                padding: 20px;
            }

            h1 {
                font-size: 27px;
            }

            .url-box {
                flex-direction: column;
            }

            .paste {
                width: 100%;
                height: 45px;
            }

            .settings {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <header>

        <div class="logo">
            ↓
        </div>

        <h1>
            Downloader Pro
        </h1>

        <p class="subtitle">
            دانلودر مدرن و سریع
        </p>

    </header>


    <div class="card">

        <label class="label">
            لینک ویدئو
        </label>


        <div class="url-box">

            <input
                id="url"
                type="text"
                placeholder="لینک ویدئو را وارد کنید..."
            >

            <button
                class="paste"
                id="pasteBtn"
            >
                چسباندن
            </button>

        </div>


        <div class="settings">

            <div>

                <label class="label">
                    کیفیت
                </label>

                <select id="quality">

                    <option value="1080">
                        1080p
                    </option>

                    <option value="720">
                        720p
                    </option>

                    <option value="480">
                        480p
                    </option>

                    <option value="360">
                        360p
                    </option>

                </select>

            </div>


            <div>

                <label class="label">
                    فرمت
                </label>

                <select id="format">

                    <option value="mp4">
                        MP4
                    </option>

                    <option value="mp3">
                        MP3
                    </option>

                </select>

            </div>

        </div>


        <button
            class="download-btn"
            id="downloadBtn"
        >
            ⬇️ اتصال به سرور
        </button>


        <div
            class="status-box"
            id="statusBox"
        >
            وضعیت: آماده
        </div>


        <div
            class="progress-box"
            id="progressBox"
        >

            <div class="progress-info">

                <span id="status">
                    در حال اتصال...
                </span>

                <span id="percent">
                    0%
                </span>

            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>

        </div>


        <div class="history">

            <div class="history-title">
                📋 دانلودهای اخیر
            </div>


            <div id="historyList">

                <div class="history-item">

                    <div class="history-icon">
                        ↓
                    </div>

                    <div class="history-text">

                        <strong>
                            هنوز دانلودی انجام نشده
                        </strong>

                        <small>
                            تاریخچه دانلود اینجا نمایش داده می‌شود
                        </small>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <footer>
        Downloader Pro © 2026
    </footer>

</div>


<script>

const API_URL =
    "https://youtube-y4x9.onrender.com";


const urlInput =
    document.getElementById("url");

const pasteBtn =
    document.getElementById("pasteBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const statusBox =
    document.getElementById("statusBox");

const progressBox =
    document.getElementById("progressBox");

const progressBar =
    document.getElementById("progressBar");

const percentText =
    document.getElementById("percent");

const statusText =
    document.getElementById("status");

const historyList =
    document.getElementById("historyList");


/* Paste */

pasteBtn.addEventListener(
    "click",
    async function () {

        try {

            const text =
                await navigator.clipboard.readText();

            urlInput.value = text;

        } catch {

            alert(
                "دسترسی به کلیپ‌بورد ممکن نیست."
            );

        }

    }
);


/* Connect to Backend */

downloadBtn.addEventListener(
    "click",
    async function () {

        const url =
            urlInput.value.trim();


        if (url === "") {

            alert(
                "لطفاً لینک را وارد کنید."
            );

            return;

        }


        downloadBtn.disabled =
            true;


        statusBox.style.display =
            "block";

        progressBox.style.display =
            "block";


        statusBox.textContent =
            "وضعیت: در حال اتصال به سرور...";


        statusText.textContent =
            "اتصال به Backend";


        progressBar.style.width =
            "30%";

        percentText.textContent =
            "30%";


        try {

            const response =
                await fetch(API_URL);


            if (!response.ok) {

                throw new Error(
                    "سرور پاسخ مناسبی نداد."
                );

            }


            const data =
                await response.json();


            progressBar.style.width =
                "100%";

            percentText.textContent =
                "100%";


            statusText.textContent =
                "اتصال موفق";


            statusBox.textContent =
                "وضعیت: Backend آنلاین است ✅";


            addHistory(
                data.message
            );


        } catch (error) {

            progressBar.style.width =
                "0%";

            percentText.textContent =
                "خطا";


            statusText.textContent =
                "اتصال ناموفق";


            statusBox.textContent =
                "خطا در اتصال به Backend ❌";


            alert(
                "خطا در اتصال به سرور:\n" +
                error.message
            );

        }


        downloadBtn.disabled =
            false;

    }
);


/* History */

function addHistory(message) {

    const item =
        document.createElement("div");


    item.className =
        "history-item";


    item.innerHTML = `

        <div class="history-icon">
            ✓
        </div>

        <div class="history-text">

            <strong>
                اتصال موفق
            </strong>

            <small>
                ${message}
            </small>

        </div>

    `;


    historyList.prepend(item);

}

</script>

</body>

</html>
